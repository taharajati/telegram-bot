services:
  postgres:
    image: postgres:16-alpine
    container_name: foroshgram_postgres
    environment:
      POSTGRES_DB: foroshgram
      POSTGRES_USER: foroshgram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foroshgram_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foroshgram -d foroshgram"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: ./telegram_order_bot
      dockerfile: Dockerfile
    container_name: foroshgram_bot
    env_file:
      - ./telegram_order_bot/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://foroshgram:${POSTGRES_PASSWORD:-foroshgram_secure_2024}@postgres:5432/foroshgram
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: ./telegram_order_website
      dockerfile: Dockerfile
    container_name: foroshgram_website
    env_file:
      - ./telegram_order_website/.env.local
    environment:
      DATABASE_URL: postgresql://foroshgram:${POSTGRES_PASSWORD:-foroshgram_secure_2024}@postgres:5432/foroshgram
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: