version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foroshgram_postgres
    environment:
      POSTGRES_DB: foroshgram
      POSTGRES_USER: foroshgram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foroshgram_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foroshgram -d foroshgram"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: ./telegram_order_bot
      dockerfile: Dockerfile
    container_name: foroshgram_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      DATABASE_URL: postgresql+asyncpg://foroshgram:${POSTGRES_PASSWORD:-foroshgram_secure_2024}@postgres:5432/foroshgram
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL}
      STORE_NAME: ${PROXY_URL:+PROXY_URL=${PROXY_URL}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: ./telegram_order_website
      dockerfile: Dockerfile
    container_name: foroshgram_website
    environment:
      DATABASE_URL: postgresql://foroshgram:${POSTGRES_PASSWORD:-foroshgram_secure_2024}@postgres:5432/foroshgram
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-foroshgram_jwt_secret_change_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: