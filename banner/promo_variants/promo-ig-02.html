<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگرام — روشن</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #e8e8f2;
    --surface:    #ffffff;
    --surface2:   #f2f2f8;
    --surface3:   #eaeaf4;
    --border:     #dcdce8;
    --border2:    #ccccdc;
    --text:       #181828;
    --text2:      #4a4a66;
    --text3:      #6e6e8a;
    --accent:     #6c5ce7;
    --accent2:    #8b7cf7;
    --green:      #00b884;
    --greenBg:    rgba(0,184,132,.08);
    --blue:       #0984e3;
    --blueBg:     rgba(9,132,227,.06);
    --orange:     #d46950;
    --orangeBg:   rgba(212,105,80,.08);
    --pink:       #e84393;
    --red:        #d63031;
    --radius:     32px;
    --shadow:     0 12px 90px rgba(0,0,0,.18);
    --glow:       rgba(108,92,231,.06);
    --custBg:     #e4e4ee;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  

  .phone-wrap { position:relative; width:400px; height:830px; flex-shrink:0; z-index:1; }
  #scene {
    position:relative; width:100%; height:100%;
    background:var(--surface); border-radius: 32px;
    border:1.5px solid var(--border2);
    box-shadow:var(--shadow), 0 0 120px var(--glow);
    overflow:hidden;
  }
  .notch {
    position:absolute; top:-1px; left:50%; transform:translateX(-50%);
    width:140px; height:26px; background:var(--surface);
    border-radius:0 0 16px 16px; border:1.5px solid var(--border2); border-top:none;
    z-index:15; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .notch .camera { width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#2a2a4a,#0a0a1a); }
  .notch .speaker { width:40px; height:3px; border-radius:2px; background:#1a1a30; }
  .status-bar {
    position:absolute; top:24px; left:0; right:0; height:38px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; font-size:12px; font-weight:600; color:var(--text); z-index:10;
  }
  .st-icons { display:flex; gap:3px; font-size:11px; }
  .st-icons svg { width:16px; height:12px; }
  .chat-header {
    position:absolute; top:60px; left:0; right:0; height:56px;
    display:flex; align-items:center; padding:0 14px; gap:10px;
    background:var(--surface); border-bottom:1px solid var(--border); z-index:10;
    transition:all .5s cubic-bezier(.16,.88,.28,1);
  }
  .chat-header .avatar-frame {
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; flex-shrink:0; position:relative;
    transition:transform .5s cubic-bezier(.16,.88,.28,1), background .5s;
  }
  .chat-header .avatar-frame.pop { animation:avatarPop .5s cubic-bezier(.16,.88,.28,1) both; }
  @keyframes avatarPop { 0%{transform:scale(0)rotate(-30deg)} 100%{transform:scale(1)rotate(0)} }
  .chat-header .avatar-frame.purple { background:linear-gradient(135deg,var(--accent),#8b5cf6); }
  .chat-header .avatar-frame.green  { background:linear-gradient(135deg,var(--green),#00e6a0); }
  .chat-header .avatar-frame.orange { background:linear-gradient(135deg,var(--orange),#f39c12); }
  .chat-header .avatar-frame.blue   { background:linear-gradient(135deg,var(--blue),#74b9ff); }
  .chat-header .avatar-frame.red    { background:linear-gradient(135deg,var(--pink),#e84393); }
  .chat-header .info { flex:1; line-height:1.3; }
  .chat-header .info .name { font-size:14px; font-weight:700; transition:all .3s; }
  .chat-header .info .sub { font-size:11px; color:var(--text3); transition:all .3s; }
  .chat-header .actions { display:flex; gap:14px; font-size:18px; color:var(--text3); }
  .messages {
    position:absolute; top:117px; left:0; right:0; bottom:64px;
    padding:10px 12px 8px; overflow:hidden;
    display:flex; flex-direction:column; gap:6px;
  }
  /* ── Message animations ── */
  .msg {
    max-width:88%; padding:10px 14px; border-radius:14px;
    font-size:14px; line-height:1.7;
    position:relative; word-wrap:break-word;
    will-change:transform,opacity;
  }
  .msg.bot, .msg.seller, .msg.system, .msg.cust, .msg.user {
    animation:msgBounce .6s cubic-bezier(.16,.88,.28,1) both;
  }
  .msg.user, .msg.cust {
    animation-name:msgBounceRight;
  }
  @keyframes msgBounce {
    0%   { opacity:0; transform:translateY(24px) scale(.88); }
    50%  { opacity:1; transform:translateY(-4px) scale(1.02); }
    75%  { transform:translateY(2px) scale(.98); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes msgBounceRight {
    0%   { opacity:0; transform:translateY(24px) translateX(12px) scale(.88); }
    50%  { opacity:1; transform:translateY(-4px) translateX(-2px) scale(1.02); }
    75%  { transform:translateY(2px) translateX(1px) scale(.98); }
    100% { opacity:1; transform:translateY(0) translateX(0) scale(1); }
  }
  .msg.bot    { align-self:flex-start; background:var(--surface2); border-bottom-left-radius:4px; ; color:#181828; }
  .msg.user   { align-self:flex-end;   background:var(--accent);   border-bottom-right-radius:4px; color:#fff !important; }
  .msg.seller { align-self:flex-start; background:var(--surface3); border-bottom-left-radius:4px; ; color:#181828; }
  .msg.cust   { align-self:flex-end;   background:var(--custBg);   border-bottom-right-radius:4px; }
  .msg.system { align-self:center; background:transparent; font-size:12px; color:var(--text3); padding:4px 0; text-align:center; max-width:100%; animation:fadeDrop .4s ease both; }
  @keyframes fadeDrop { 0%{opacity:0;transform:translateY(-8px)} 100%{opacity:1;transform:translateY(0)} }
  .msg .label { font-size:10px; color:var(--text3); font-weight:500; margin-bottom:1px; display:block; }
  .msg .price { color:var(--green); font-weight:600; }
  .msg .time-tag { font-size:9px; color:var(--text3); margin-top:4px; display:block; text-align:left; direction:ltr; }
  .msg.user .time-tag { color:rgba(255,255,255,.4); text-align:right; }
  .msg .check { font-size:11px; color:var(--green); margin-right:4px; }

  /* ── Typing indicator (Telegram style) ── */
  .typing {
    align-self:flex-start; display:flex; align-items:center; gap:8px;
    animation:msgBounce .5s cubic-bezier(.16,.88,.28,1) both;
  }
  .typing .t-avatar {
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; flex-shrink:0; background:linear-gradient(135deg,var(--accent),#8b5cf6);
  }
  .typing .t-dots {
    background:var(--surface2); border-radius:14px; padding:12px 18px;
    display:flex; gap:5px; border-bottom-left-radius:4px;
  }
  .typing .t-dots span {
    width:8px; height:8px; border-radius:50%; background:var(--text2);
    animation:tTyping 1.4s infinite both;
  }
  .typing .t-dots span:nth-child(2) { animation-delay:.2s; }
  .typing .t-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes tTyping {
    0%,60%,100% { transform:translateY(0); background:var(--text3); }
    30% { transform:translateY(-10px); background:var(--accent2); }
  }

  /* ── Button row ── */
  .btns-row {
    align-self:flex-start; display:flex; flex-wrap:wrap; gap:6px;
    animation:btnsIn .5s cubic-bezier(.16,.88,.28,1) both;
  }
  .btns-row.btns-end { align-self:flex-end; }
  @keyframes btnsIn {
    0% { opacity:0; transform:translateY(16px) scale(.9); }
    60% { transform:translateY(-2px) scale(1.01); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  .btn {
    padding:7px 18px; font-size:12.5px; font-family:'Vazirmatn',sans-serif;
    border-radius:20px; cursor:pointer; border:1px solid var(--accent);
    color:var(--accent2); background:transparent; white-space:nowrap;
    transition:all .15s; position:relative; overflow:hidden;
  }
  .btn::after {
    content:''; position:absolute; inset:0; background:currentColor; opacity:0;
    transition:opacity .25s;
  }
  .btn:active::after { opacity:.12; }
  .btn:hover { background:rgba(108,92,231,.1); transform:scale(1.02); }
  .btn:active { transform:scale(.96); }
  .btn.primary { background:var(--accent); color:#fff !important; border-color:var(--accent); }
  .btn.primary:hover { background:#7c6cf7; }
  .btn.green   { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.green:hover { background:#0ae6b0; }
  .btn.ghost   { border-color:var(--text3); color:var(--text2); }
  .btn.ghost:hover { border-color:var(--accent); color:var(--accent2); }
  .btn.danger  { background:var(--red); color:#fff; border-color:var(--red); }
  .btn.orange  { background:var(--orange); color:#1a1a2e; border-color:var(--orange); }
  .btn.small   { font-size:11px; padding:4px 12px; }
  .btn .ripple {
    position:absolute; border-radius:50%; background:rgba(255,255,255,.3);
    transform:scale(0); animation:ripple .6s ease-out; pointer-events:none;
  }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }

  .bottom-bar {
    position:absolute; bottom:0; left:0; right:0; height:64px;
    display:flex; align-items:center; padding:0 10px; gap:6px;
    background:var(--surface); border-top:1px solid var(--border);
    animation:barSlide .6s .3s both cubic-bezier(.16,.88,.28,1);
  }
  @keyframes barSlide { 0%{transform:translateY(100%)} 100%{transform:translateY(0)} }
  .bb-icon {
    width:36px; height:36px; border-radius:50%; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--text3); flex-shrink:0; transition:all .2s;
  }
  .bb-icon:hover { background:var(--surface3); }
  .bb-input {
    flex:1; height:38px; background:var(--surface2); border-radius:20px;
    border:none; outline:none; padding:0 14px;
    color:var(--text); font-family:'Vazirmatn',sans-serif; font-size:13px;
    transition:all .2s;
  }
  .bb-input:focus { background:var(--surface3); }
  .bb-input::placeholder { color:var(--text3); font-size:12px; }
  .bb-send { width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; flex-shrink:0; transition:all .2s; }
  .bb-send:active { transform:scale(.9); }

  /* ── Intro splash ── */
  .intro {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); z-index:35;
    animation:fadeOut 1s forwards; animation-delay:3s;
  }
  @keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0;pointer-events:none}}
  .intro .logo-big {
    width:96px; height:96px; border-radius:26px;
    background:linear-gradient(135deg,var(--accent),#8b5cf6,var(--pink));
    display:flex; align-items:center; justify-content:center; font-size:38px;
    box-shadow:0 0 120px rgba(108,92,231,.25);
    animation:logoEntrance .8s cubic-bezier(.16,.88,.28,1) both, glowPulse 2s 1s infinite;
  }
  @keyframes logoEntrance {
    0% { opacity:0; transform:scale(.5) rotate(-20deg); }
    60% { transform:scale(1.1) rotate(3deg); }
    100% { opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes glowPulse{0%,100%{box-shadow:0 0 40px rgba(108,92,231,.12)}50%{box-shadow:0 0 100px rgba(108,92,231,.4)}}
  .intro h1 {
    font-size:34px; font-weight:800; margin-top:24px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:titleSlide .6s .2s both cubic-bezier(.16,.88,.28,1);
  }
  @keyframes titleSlide { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
  .intro p { font-size:14px; color:var(--text2); margin-top:8px; letter-spacing:.5px; animation:titleSlide .6s .35s both cubic-bezier(.16,.88,.28,1); }

  /* ── Control panel ── */
  .control-panel {
    position:absolute; bottom:-110px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:400px; z-index:40; pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  .control-panel.hidden { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }
  .control-panel > * { pointer-events:auto; }
  .cp-timer { font-size:10px; color:var(--text3); font-weight:500; direction:ltr; min-width:40px; text-align:center; }

  .scene-banner {
    position:absolute; top:40%; left:10%; right:10%; z-index:30;
    background:rgba(255,255,255,.92); color:#181828; border:1px solid rgba(0,0,0,.1); border:1px solid var(--border2); border-radius:16px;
    padding:24px 16px; text-align:center;
    animation:bannerIn .5s cubic-bezier(.16,.88,.28,1) both, bannerOut .4s .9s ease both;
    pointer-events:none;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 40px rgba(0,0,0,.4);
  }
  @keyframes bannerIn{
    0%{opacity:0;transform:scale(.7)translateY(-20px)rotateX(10deg)}
    60%{transform:scale(1.02)translateY(2px)}
    100%{opacity:1;transform:scale(1)translateY(0)rotateX(0)}
  }
  @keyframes bannerOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)translateY(-10px)}}
  .scene-banner .b-icon { font-size:38px; margin-bottom:8px; display:block; }
  .scene-banner .b-name { font-size:18px; font-weight:700; }
  .cp-main {
    display:flex; align-items:center; gap:12px;
    background:var(--surface2); border:1px solid var(--border); border-radius:22px;
    padding:8px 18px; backdrop-filter:blur(16px); box-shadow:0 4px 30px rgba(0,0,0,.4);
  }
  .cp-btn {
    width:36px; height:36px; border-radius:50%; border:none; background:var(--surface3);
    color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s; flex-shrink:0;
  }
  .cp-btn:hover { background:var(--accent); transform:scale(1.05); }
  .cp-btn:active { transform:scale(.92); }
  .cp-btn.play { width:44px; height:44px; background:var(--accent); font-size:20px; box-shadow:0 0 20px rgba(108,92,231,.3); transition:all .2s; }
  .cp-btn.play:hover { transform:scale(1.08); box-shadow:0 0 30px rgba(108,92,231,.5); }
  .cp-btn.play:active { transform:scale(.95); }
  .cp-scene-label { font-size:11px; color:var(--text2); min-width:120px; text-align:center; font-weight:500; }
  .cp-scene-label strong { color:var(--text); }
  .cp-progress { width:80px; height:3px; background:var(--surface3); border-radius:4px; overflow:hidden; }
  .cp-progress .fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:4px; width:0%; transition:width .6s cubic-bezier(.16,.88,.28,1); }
  .cp-step { display:flex; gap:6px; }
  .cp-step-dot { width:6px; height:6px; border-radius:50%; background:var(--text3); transition:all .4s cubic-bezier(.16,.88,.28,1); }
  .cp-step-dot.active { background:var(--accent2); width:18px; border-radius:3px; }
  .cp-step-dot.done { background:var(--accent); }
  .cp-cue { font-size:11px; color:var(--text3); background:var(--surface); border:1px dashed var(--border); border-radius:10px; padding:5px 14px; max-width:360px; text-align:center; opacity:.7; }
  .cp-cue strong { color:var(--accent2); }

  /* ── Rich content blocks ── */
  .card { background:var(--surface); border-radius:12px; overflow:hidden; margin-top:4px; animation:cardIn .5s cubic-bezier(.16,.88,.28,1) both; }
  @keyframes cardIn { 0%{opacity:0;transform:translateY(12px)scale(.96)} 100%{opacity:1;transform:translateY(0)scale(1)} }
  .card .img-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px; height:100px; }
  .card .img-grid > div { display:flex; align-items:center; justify-content:center; font-size:28px; transition:all .3s; }
  .card .img-grid > div:hover { transform:scale(1.05); z-index:2; }
  .card .img-grid > div:nth-child(1){background:linear-gradient(135deg,#1a1a3e,#2a1a5e)}
  .card .img-grid > div:nth-child(2){background:linear-gradient(135deg,#1a2a3e,#2a3a5e)}
  .card .img-grid > div:nth-child(3){background:linear-gradient(135deg,#2a1a3e,#3a2a5e)}
  .card .img-grid > div:nth-child(4){background:linear-gradient(135deg,#1a2a2e,#2a3a4e)}
  .card .body { padding:8px 12px; }
  .card .body .n { font-weight:600; font-size:13px; }
  .card .body .d { color:var(--text2); font-size:11px; }

  .receipt { background:var(--surface); border-radius:12px; padding:12px; border:1px dashed var(--border); animation:cardIn .5s cubic-bezier(.16,.88,.28,1) both; }
  .receipt .rl { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; animation:slideRow .4s both; }
  .receipt .rl:nth-child(1){animation-delay:.1s}
  .receipt .rl:nth-child(2){animation-delay:.2s}
  .receipt .rl:nth-child(3){animation-delay:.3s}
  .receipt .rl:nth-child(4){animation-delay:.4s}
  .receipt .rl.t { border-top:1px solid var(--border); margin-top:6px; padding-top:6px; font-weight:600; color:var(--green); }
  @keyframes slideRow { 0%{opacity:0;transform:translateX(8px)} 100%{opacity:1;transform:translateX(0)} }
  .receipt .ll { color:var(--text2); }
  .receipt .rd { text-align:center; color:var(--text3); font-size:10px; padding:4px 0; letter-spacing:3px; }

  .order-card { background:var(--surface); border-radius:12px; padding:12px; margin-top:4px; border:1px solid var(--border); animation:cardIn .5s cubic-bezier(.16,.88,.28,1) both; }
  .order-card .oh { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); margin-bottom:6px; }
  .order-card .or { display:flex; gap:6px; align-items:center; font-size:12px; padding:2px 0; animation:slideRow .3s both; }
  .order-card .or:nth-child(2){animation-delay:.1s}
  .order-card .or:nth-child(3){animation-delay:.15s}
  .order-card .or:nth-child(4){animation-delay:.2s}
  .order-card .or:nth-child(5){animation-delay:.25s}
  .order-card .or:nth-child(6){animation-delay:.3s}
  .order-card .or:nth-child(7){animation-delay:.35s}
  .order-card .ob { display:inline-block; padding:1px 10px; border-radius:10px; font-size:10px; font-weight:600; }
  .order-card .ob.pending { background:rgba(253,203,110,.15); color:var(--orange); }
  .order-card .ob.confirmed { background:rgba(9,132,227,.15); color:var(--blue); }
  .order-card .ob.shipped { background:rgba(0,210,160,.15); color:var(--green); }

  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px; }
  .dash-item {
    background:var(--surface2); border-radius:10px; padding:10px; text-align:center;
    animation:dashIn .4s cubic-bezier(.16,.88,.28,1) both;
  }
  .dash-item:nth-child(1){animation-delay:.1s}.dash-item:nth-child(2){animation-delay:.15s}
  .dash-item:nth-child(3){animation-delay:.2s}.dash-item:nth-child(4){animation-delay:.25s}
  @keyframes dashIn { 0%{opacity:0;transform:scale(.8)translateY(10px)} 100%{opacity:1;transform:scale(1)translateY(0)} }
  .dash-item .d-num { font-size:22px; font-weight:800; }
  .dash-item .d-label { font-size:10px; color:var(--text3); margin-top:2px; }
  .dash-item .d-icon { font-size:20px; margin-bottom:2px; }

  .fg { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px; }
  .fg .fi {
    background:var(--surface2); border-radius:10px; padding:8px; display:flex; align-items:center; gap:6px; font-size:11px;
    animation:dashIn .3s both;
  }
  .fg .fi:nth-child(1){animation-delay:0s}.fg .fi:nth-child(2){animation-delay:.05s}
  .fg .fi:nth-child(3){animation-delay:.1s}.fg .fi:nth-child(4){animation-delay:.15s}
  .fg .fi:nth-child(5){animation-delay:.2s}.fg .fi:nth-child(6){animation-delay:.25s}
  .fg .fi:nth-child(7){animation-delay:.3s}.fg .fi:nth-child(8){animation-delay:.35s}
  .fg .fi:nth-child(9){animation-delay:.4s}.fg .fi:nth-child(10){animation-delay:.45s}
  .fg .fi:nth-child(11){animation-delay:.5s}.fg .fi:nth-child(12){animation-delay:.55s}
  .fg .fi:nth-child(13){animation-delay:.6s}.fg .fi:nth-child(14){animation-delay:.65s}
  .fg .fi .ficon { font-size:18px; }

  .pli {

  .pli:hover .p-action { color:var(--accent2); }

  .dc {
    background:var(--surface); border-radius:10px; padding:10px; margin-top:4px; border:1px solid var(--border);

  .code-input { display:inline-block; background:var(--surface3); padding:4px 14px; border-radius:8px; font-family:monospace; font-size:13px; direction:ltr; border:1.5px dashed var(--accent); animation:pulseBorder 2s ease infinite; }

  @media (max-width:480px){

</style>
</head>
<body>

<script>

  }
  function stopCurrentScene(){if(abortController){abortController.abort();abortController=null}sceneRunning=false;}
  function togglePause(){
    paused=!paused;btnPlay.textContent=paused?'▶':'⏸';btnPlay.style.background=paused?'var(--green)':'var(--accent)';
    if(!paused&&!sceneRunning&&currentScene<SCENE_FNS.length-1){goToScene(currentScene+1)}
    else if(!paused&&!sceneRunning&&currentScene===SCENE_FNS.length-1){paused=true;btnPlay.textContent='▶'}
  }
  function goToScene(idx){if(idx<0||idx>=SCENE_FNS.length)return;stopCurrentScene();clearMsgs();currentScene=idx;runScene(idx);}
  btnPlay.addEventListener('click',togglePause);
  document.getElementById('scene').addEventListener('click',togglePause);
  btnPrev.addEventListener('click',()=>{if(paused)goToScene(currentScene-1)});
  btnNext.addEventListener('click',()=>{if(paused)goToScene(currentScene+1)});
  document.addEventListener('keydown',e=>{
    if(e.key===' '||e.code==='Space'){e.preventDefault();togglePause()}
    if(e.key==='ArrowRight'&&paused)goToScene(currentScene+1);
    if(e.key==='ArrowLeft'&&paused)goToScene(currentScene-1);
    if(e.key==='h'||e.key==='H'){panelVisible=!panelVisible;document.getElementById('controlPanel').classList.toggle('hidden',!panelVisible);document.getElementById('bottomBar').style.opacity=panelVisible?'1':'0'}
  });
  function tick(){const d=new Date();clock.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
  tick();setInterval(tick,10000);
  // Only respond to intro's own fadeOut animation, not bubbled child animations
  const introEl=document.getElementById('introOverlay');
  function onIntroEnd(e){if(e.animationName==='fadeOut'){introEl.removeEventListener('animationend',onIntroEnd);runScene(0)}}
  introEl.addEventListener('animationend',onIntroEnd);
  updateUI(0);
})();
</script>
</body>
</html>
